<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Icon Logo: Futuristic PC Chip / Hexagon -->
  <g transform="translate(10, 8)">
    <rect x="2" y="2" width="40" height="40" rx="8" fill="url(#gradLogo)" />
    <!-- Inner circuit pattern -->
    <rect x="10" y="10" width="24" height="24" rx="4" fill="#0f172a" />
    <circle cx="22" cy="22" r="5" fill="#38bdf8" />
    <!-- Connector pins -->
    <line x1="22" y1="2" x2="22" y2="7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="37" x2="22" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="2" y1="22" x2="7" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="37" y1="22" x2="42" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    DANANG<tspan fill="#2563eb">PC</tspan>
  </text>
  <text x="63" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">
    LINH KIỆN &amp; PHỤ KIỆN MÁY TÍNH
  </text>
</svg>
